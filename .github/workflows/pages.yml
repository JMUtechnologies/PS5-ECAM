# Playtendoh's site on GitHub Pages (Settings > Pages > Source: GitHub Actions), from site/.
#
# It is built again when site/ changes, by hand, when a release is published, with the latest
# release's notes in the page (site/build.py) for readers GitHub's API turns away, and every day, with
# the table players' reports make (compatibility.html) from the report intake (tools/log-intake): its
# address is the repository variable REPORTS_URL (Settings > Secrets and variables > Actions > Variables).

name: Pages

on:
  push:
    branches: [Playtendoh] # the github-pages environment allows it (Settings > Environments)
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release's run is on its tag, which the github-pages environment doesn't deploy from: it starts
  # this workflow on the default branch instead (a dispatch with GITHUB_TOKEN still starts a run).
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Build the site again on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest.json || echo '{}' > latest.json
      - name: The table players' reports make
        env:
          REPORTS_URL: ${{ vars.REPORTS_URL }}
        run: |
          if [ -n "$REPORTS_URL" ]; then
            # the run's own address: the intake keeps its table an hour for anyone else, never for this
            curl -fsS --max-time 60 "$REPORTS_URL/v1/compatibility.json?run=$GITHUB_RUN_ID" -o compatibility.json || echo '{}' > compatibility.json
          else
            echo '{}' > compatibility.json
          fi
      - name: Build
        run: python3 site/build.py --release latest.json --compat compatibility.json --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
