# PS5-ECAM's site on GitHub Pages (Settings > Pages > Source: GitHub Actions), from site/.
#
# It is built again when site/ changes, by hand, and when a release is published, with the latest
# release's notes in the page (site/build.py) for readers GitHub's API turns away.

name: Pages

on:
  push:
    branches: [PS5-ECAM]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release's run is on its tag, which the github-pages environment doesn't deploy from: it starts
  # this workflow on the default branch instead (a dispatch with GITHUB_TOKEN still starts a run).
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Build the site again on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest.json || echo '{}' > latest.json
      - name: Build
        run: python3 site/build.py --release latest.json --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
