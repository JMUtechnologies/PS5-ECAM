# Playtendoh's report intake (README.md): a Cloudflare Worker and a D1 database. Nothing secret is in
# this file or in the app: the Worker needs no key to take reports, and the table it publishes has no
# install IDs in it. Deploy: npx wrangler deploy (after the steps in README.md).
name = "playtendoh-reports"
main = "src/index.js"
compatibility_date = "2025-06-01"

# The reports, private: only this Worker and the owner's wrangler reach them.
[[d1_databases]]
binding = "DB"
database_name = "playtendoh-reports"
database_id = "03e1cd36-edb3-484f-996a-32f48b2fa6d9"

# At most 20 reports a minute per install ID (a whole outbox at once) and 30 per network address (the ID
# is the client's to choose; the address is not). Cloudflare's limiter counts over 10 or 60 seconds only.
# The app keeps a report that is turned away and tries later.
[[ratelimits]]
name = "INSTALL_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "ADDRESS_LIMITER"
namespace_id = "2002"

  [ratelimits.simple]
  limit = 30
  period = 60

# Reports older than 180 days are deleted once a day.
[triggers]
crons = ["17 3 * * *", "41 * * * *"] # the first: old reports deleted (src/index.js DAILY); the second: the site rebuilt
